services:
  - type: web
    name: apify-yt-api
    runtime: python
    rootDir: yt-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: EXTRACTOR_SECRET
        sync: false
      - key: YT_PLAYER_CLIENTS
        value: android,web
        sync: false
